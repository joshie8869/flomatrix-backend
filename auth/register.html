<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Create Account — FloMatrix</title>

    <link rel="stylesheet" href="../css/theme-dark.css" id="theme-css" />
    <link rel="stylesheet" href="../css/auth-base.css" />
</head>

<body>

<div class="auth-container">

    <div class="auth-panel">
        <div class="auth-logo">FloMatrix</div>

        <h2 class="auth-title">Create Account</h2>

        <input id="username" class="auth-input" type="text" placeholder="Username" />
        <input id="email" class="auth-input" type="email" placeholder="Email" />
        <input id="password" class="auth-input" type="password" placeholder="Password" />

        <button id="reg-btn" class="auth-btn-primary">Create Account</button>

        <div class="auth-small">
            Already registered?
            <a href="login.html">Back to login</a>
        </div>

        <div id="auth-msg" class="auth-msg"></div>
    </div>
</div>

<script src="../js/auth.js"></script>

<script>
(function() {

    const unameEl = document.getElementById("username");
    const emailEl = document.getElementById("email");
    const pwdEl   = document.getElementById("password");
    const msgEl   = document.getElementById("auth-msg");
    const btn     = document.getElementById("reg-btn");

    async function doRegister() {
        msgEl.innerText = "";
        btn.disabled = true;
        btn.innerText = "Creating…";

        try {
            const uname = unameEl.value;
            const email = emailEl.value;
            const pwd   = pwdEl.value;

            await fmAuth.register(email, pwd, uname);

            // after registration, go straight to chart
            window.location.href = "/chart.html";

        } catch (e) {
            msgEl.innerText = e.message || "Registration failed.";
        } finally {
            btn.disabled = false;
            btn.innerText = "Create Account";
        }
    }

    btn.addEventListener("click", doRegister);

    pwdEl.addEventListener("keyup", (ev) => {
        if (ev.key === "Enter") {
            doRegister();
        }
    });

})();
</script>

</body>
</html>
